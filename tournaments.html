<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tournaments | SportU</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>🏆 Tournaments</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="matches.html">Matches</a>
    <a href="create-tournament.html">➕ Create Tournament</a>
  </nav>
</header>

<div class="container" id="tournaments"></div>

<script src="data.js"></script>
<script>
  const container = document.getElementById("tournaments");

  // Get tournaments created by user
  const savedTournaments = JSON.parse(localStorage.getItem("tournaments")) || [];

  // Combine default + created tournaments
  const allTournaments = [...tournaments, ...savedTournaments];

  if (allTournaments.length === 0) {
    container.innerHTML = "<p>No tournaments created yet.</p>";
  }

  allTournaments.forEach(t => {
    container.innerHTML += `
      <div class="card">
        <h3>${t.name}</h3>
        <p>Location: ${t.location}</p>
        <p>Teams: ${t.teams.length}</p>
        <a href="tournament.html?id=${t.id}">View Tournament</a>
      </div>
    `;
  });
</script>

</body>
</html>
