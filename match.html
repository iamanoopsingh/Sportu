<!DOCTYPE html>
<html>
<head>
  <title>Match Details</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <a href="matches.html">← Back to Matches</a>
</nav>

<h1>Match Details</h1>

<div id="matchDetails"></div>

<script src="data.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  const matches = getMatches();
  const match = matches[id];
  const container = document.getElementById("matchDetails");

  if (!match) {
    container.innerHTML = "<p>Match not found.</p>";
  } else {
    container.innerHTML = `
      <div class="card">
        <h2>${match.teamA} vs ${match.teamB}</h2>
        <p><strong>Date:</strong> ${match.date}</p>
        <p><strong>Location:</strong> ${match.location}</p>
        <p><strong>Status:</strong> Upcoming</p>
      </div>
    `;
  }
</script>

</body>
</html>
