<!DOCTYPE html>
<html>
<head>
  <title>Match Details</title>
  <script src="data.js"></script>
  <style>
    body { background:#0b1f3a; color:#fff; font-family:Arial }
    .box { background:#132e57; padding:20px; border-radius:10px }
    a { color:#4da3ff }
  </style>
</head>
<body>

<a href="matches.html">← Back to Matches</a>

<div id="match" class="box"></div>

<script>
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  const matches = getMatches();
  const match = matches[id];

  if (!match) {
    document.getElementById("match").innerHTML = "<p>Match not found</p>";
  } else {
    document.getElementById("match").innerHTML = `
      <h2>${match.teamA} vs ${match.teamB}</h2>
      <p><strong>Date:</strong> ${match.date}</p>
      <p><strong>Location:</strong> ${match.location}</p>
    `;
  }
</script>

</body>
</html>
