<!DOCTYPE html>
<html>
<head>
  <title>Create Tournament | SportU</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Create Tournament</h2>

<div class="card">
  <input id="name" placeholder="Tournament Name"><br><br>
  <input id="location" placeholder="Location"><br><br>
  <input id="teams" placeholder="Teams (comma separated)"><br><br>
  <button onclick="saveTournament()">Create Tournament</button>
</div>

<script>
function saveTournament() {
  const tournament = {
    id: Date.now(),
    name: name.value,
    location: location.value,
    teams: teams.value.split(",")
  };

  const tournaments = JSON.parse(localStorage.getItem("tournaments")) || [];
  tournaments.push(tournament);
  localStorage.setItem("tournaments", JSON.stringify(tournaments));

  alert("Tournament created!");
  window.location.href = "tournaments.html";
}
</script>

</body>
</html>
