<!DOCTYPE html>
<html>
<head>
  <title>Create Match | SportU</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>➕ Create Match</h2>

<form id="matchForm">
  <input placeholder="Team 1" required id="team1"><br>
  <input placeholder="Team 2" required id="team2"><br>
  <input placeholder="Date" required id="date"><br>
  <input placeholder="Venue" required id="venue"><br>
  <button type="submit">Create Match</button>
</form>

<script src="data.js"></script>
<script>
document.getElementById("matchForm").addEventListener("submit", e => {
  e.preventDefault();

  const match = {
    id: Date.now(),
    team1: team1.value,
    team2: team2.value,
    date: date.value,
    venue: venue.value,
    status: "Upcoming",
    runs: 0,
    wickets: 0,
    overs: 0
  };

  saveMatch(match);
  window.location.href = "matches.html";
});
</script>

</body>
</html>
