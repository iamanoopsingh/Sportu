<!DOCTYPE html>
<html>
<head>
  <title>Create Match</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <a href="matches.html">← Back</a>
</nav>

<h1>Create Match</h1>

<form id="matchForm">
  <input placeholder="Team A" required><br><br>
  <input placeholder="Team B" required><br><br>
  <input type="date" required><br><br>
  <input placeholder="Location" required><br><br>
  <button type="submit">Create</button>
</form>

<script src="data.js"></script>
<script>
  document.getElementById("matchForm").onsubmit = function(e) {
    e.preventDefault();

    const inputs = e.target.elements;
    const matches = getMatches();

    matches.push({
      teamA: inputs[0].value,
      teamB: inputs[1].value,
      date: inputs[2].value,
      location: inputs[3].value
    });

    saveMatches(matches);
    window.location.href = "matches.html";
  };
</script>

</body>
</html>
