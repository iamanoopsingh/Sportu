<!DOCTYPE html>
<html>
<head>
  <title>Create Match | SportU</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Create Match</h2>

<div class="card">
  <input id="team1" placeholder="Team 1"><br><br>
  <input id="team2" placeholder="Team 2"><br><br>
  <input id="date" placeholder="Match Date"><br><br>
  <input id="venue" placeholder="Venue"><br><br>
  <button onclick="saveMatch()">Create Match</button>
</div>

<script>
function saveMatch() {
  const match = {
    id: Date.now(),
    team1: team1.value,
    team2: team2.value,
    date: date.value,
    venue: venue.value,
    status: "Upcoming"
  };

  const matches = JSON.parse(localStorage.getItem("matches")) || [];
  matches.push(match);
  localStorage.setItem("matches", JSON.stringify(matches));

  alert("Match created!");
  window.location.href = "matches.html";
}
</script>

</body>
</html>
