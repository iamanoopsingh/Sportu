<!DOCTYPE html>
<html>
<head>
  <title>Create Match</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Create Match</h2>

<form id="matchForm">
  <input type="text" id="team1" placeholder="Team 1" required><br><br>
  <input type="text" id="team2" placeholder="Team 2" required><br><br>
  <input type="date" id="date" required><br><br>
  <input type="text" id="venue" placeholder="Venue" required><br><br>

  <button type="submit">Create Match</button>
</form>

<script src="data.js"></script>

<script>
document.getElementById("matchForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const match = {
    id: Date.now(),
    team1: team1.value,
    team2: team2.value,
    date: date.value,
    venue: venue.value,
    status: "Upcoming",
    runs: 0,
    wickets: 0,
    overs: 0
  };

  saveMatch(match);
  alert("Match Created Successfully!");
  window.location.href = "matches.html";
});
</script>

</body>
</html>
