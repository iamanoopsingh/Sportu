<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Matches | SportU</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>🏏 Matches</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="tournaments.html">Tournaments</a>
    <a href="create-match.html">➕ Create Match</a>
  </nav>
</header>

<div class="container" id="matches"></div>

<script src="data.js"></script>
<script>
  const container = document.getElementById("matches");

  // Get matches created by user
  const savedMatches = JSON.parse(localStorage.getItem("matches")) || [];

  // Combine default + created matches
  const allMatches = [...matches, ...savedMatches];

  if (allMatches.length === 0) {
    container.innerHTML = "<p>No matches created yet.</p>";
  }

  allMatches.forEach(match => {
    container.innerHTML += `
      <div class="card">
        <h3>${match.team1} vs ${match.team2}</h3>
        <p>${match.date} | ${match.venue}</p>
        <p>Status: ${match.status}</p>
        <a href="match.html?id=${match.id}">View Match</a>
      </div>
    `;
  });
</script>

</body>
</html>
