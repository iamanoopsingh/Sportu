<!DOCTYPE html>
<html>
<head>
  <title>Matches</title>
  <script src="data.js"></script>
  <style>
    body { background:#0b1f3a; color:#fff; font-family:Arial }
    .card { background:#132e57; padding:15px; margin:10px 0; border-radius:8px }
    a { color:#4da3ff; text-decoration:none }
  </style>
</head>
<body>

<h2>Matches</h2>
<a href="create-match.html">+ Create Match</a>

<div id="matches"></div>

<script>
  const container = document.getElementById("matches");
  const matches = getMatches();

  if (matches.length === 0) {
    container.innerHTML = "<p>No matches created</p>";
  }

  matches.forEach((m, i) => {
    container.innerHTML += `
      <div class="card">
        <h3>${m.teamA} vs ${m.teamB}</h3>
        <p>${m.date} | ${m.location}</p>
        <a href="match.html?id=${i}">View Match</a>
      </div>
    `;
  });
</script>

</body>
</html>
