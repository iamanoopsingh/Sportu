<!DOCTYPE html>
<html>
<head>
  <title>Matches</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="matches.html">Matches</a>
  <a href="tournaments.html">Tournaments</a>
</nav>

<h1>Matches</h1>
<a href="create-match.html">+ Create Match</a>

<div id="matches"></div>

<script src="data.js"></script>
<script>
  const matches = getMatches();
  const container = document.getElementById("matches");

  if (!matches || matches.length === 0) {
    container.innerHTML = "<p>No matches created yet.</p>";
  } else {
    matches.forEach((m, i) => {
      const teamA = m.teamA || m.team1 || "Team A";
      const teamB = m.teamB || m.team2 || "Team B";
      const location = m.location || m.venue || "Unknown";

      container.innerHTML += `
        <div class="card">
          <h3>${teamA} vs ${teamB}</h3>
          <p>${m.date || ""} | ${location}</p>
          <a href="match.html?id=${i}">View Match</a>
        </div>
      `;
    });
  }
</script>

</body>
</html>
