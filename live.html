<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Upcoming Matches | SportU</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #0b1d3a, #020c1b);
      color: #ffffff;
    }

    header {
      background: #0b1d3a;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    nav a {
      color: #ffffff;
      margin-left: 15px;
      text-decoration: none;
      font-size: 14px;
    }

    main {
      padding: 25px 20px;
    }

    h2 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #b5c7e3;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .match-card {
      background: #1e3a8a;
      margin-bottom: 14px;
      padding: 14px;
      border-radius: 12px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.3);
    }

    .match-card strong {
      font-size: 15px;
    }

    .match-meta {
      font-size: 13px;
      color: #dbeafe;
      margin-top: 6px;
    }

    footer {
      margin-top: 40px;
      text-align: center;
      font-size: 13px;
      color: #9fb3d9;
    }
  </style>
</head>

<body>

  <header>
    <h1>SportU</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="matches.html">Matches</a>
      <a href="news.html">News</a>
    </nav>
  </header>

  <main>
    <h2>📅 Upcoming Cricket Matches</h2>
    <p class="subtitle">Stay updated with scheduled cricket matches</p>

    <div id="matches">Loading upcoming matches…</div>

    <footer>© 2026 SportU</footer>
  </main>

  <script>
    const container = document.getElementById("matches");

    const options = {
      method: "GET",
      headers: {
        "X-RapidAPI-Key": "b301206b-3121-452c-a1dc-ea6e56e317f9",
        "X-RapidAPI-Host": "cricbuzz-cricket.p.rapidapi.com"
      }
    };

    fetch("https://cricbuzz-cricket.p.rapidapi.com/matches/v1/upcoming", options)
      .then(response => response.json())
      .then(data => {
        container.innerHTML = "";

        if (!data || !data.typeMatches) {
          container.innerHTML = "No upcoming matches found.";
          return;
        }

        data.typeMatches.forEach(type => {
          type.seriesMatches.forEach(series => {
            if (!series.seriesAdWrapper) return;

            series.seriesAdWrapper.matches.forEach(match => {
              const info = match.matchInfo;
              const div = document.createElement("div");
              div.className = "match-card";
              div.innerHTML = `
                <strong>${info.team1.teamName} vs ${info.team2.teamName}</strong>
                <div class="match-meta">
                  🏟 ${info.venueInfo.ground}, ${info.venueInfo.city}<br>
                  ⏰ ${new Date(info.startDate).toLocaleString()}
                </div>
              `;
              container.appendChild(div);
            });
          });
        });
      })
      .catch(error => {
        console.error(error);
        container.innerHTML = "Unable to load matches at the moment.";
      });
  </script>

</body>
</html>
